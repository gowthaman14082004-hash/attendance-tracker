<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to V Secure Technologies Attendance System">
  <title>Sign In — V Secure Technologies</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-box">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-icon" aria-hidden="true">🏢</div>
      <h1>V Secure Technologies</h1>
      <p>Attendance &amp; Field Tracking System</p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }} flash-login" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login form -->
    <form method="POST" action="{{ url_for('login') }}" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-password-wrap">
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button type="button" class="toggle-pw" onclick="togglePassword()" aria-label="Show/hide password">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-login" id="loginBtn">
        Sign In
      </button>
    </form>

    <div class="login-footer">
      <span>Default credentials: <code>admin</code> / <code>admin123</code></span>
    </div>
  </div>
</div>

<script>
  function togglePassword() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  // Loading state on submit
  document.querySelector('form').addEventListener('submit', function () {
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Signing in…';
    btn.disabled = true;
  });
</script>
</body>
</html>
